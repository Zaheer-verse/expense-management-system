<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saving Goals | Smart Student Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <aside class="sidebar glass">
    <a class="brand" href="index.html">
      <span class="brand-mark">SE</span>
      <div>
        <h1>Smart Expense</h1>
        <p>Student Tracker</p>
      </div>
    </a>
    <nav>
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="add-expense.html">Add Expense</a>
      <a class="nav-link" href="analytics.html">Analytics</a>
      <a class="nav-link active" href="goals.html">Saving Goals</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>
    <button id="themeToggle" class="btn secondary full">Toggle Theme</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2>Set Saving Goals</h2>
        <p>Create targets for trips, gadgets, semester projects, and build savings discipline.</p>
      </div>
      <div class="topbar-image">
        <img src="https://images.unsplash.com/photo-1633158829585-23ba8f7c8caf?auto=format&fit=crop&w=900&q=80" alt="Savings jar and coins" />
      </div>
    </header>

    <section class="grid-two reveal">
      <article class="card glass">
        <h3>New Goal</h3>
        <form id="goalForm" class="form">
          <label>
            Goal Name
            <input type="text" name="name" placeholder="Laptop fund" required />
          </label>

          <label>
            Target Amount (PKR)
            <input type="number" name="target" min="1" step="1" required />
          </label>

          <label>
            Current Saved (PKR)
            <input type="number" name="saved" min="0" step="1" required />
          </label>

          <button class="btn" type="submit">Add Goal</button>
        </form>
      </article>

      <article class="card glass">
        <div class="card-head">
          <h3>Your Goals</h3>
          <button id="clearGoals" class="btn danger small">Clear Goals</button>
        </div>
        <div id="goalsList" class="goal-list"></div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
