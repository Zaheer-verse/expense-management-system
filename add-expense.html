<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense | Smart Student Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <aside class="sidebar glass">
    <a class="brand" href="index.html">
      <span class="brand-mark">SE</span>
      <div>
        <h1>Smart Expense</h1>
        <p>Student Tracker</p>
      </div>
    </a>
    <nav>
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link active" href="add-expense.html">Add Expense</a>
      <a class="nav-link" href="analytics.html">Analytics</a>
      <a class="nav-link" href="goals.html">Saving Goals</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>
    <button id="themeToggle" class="btn secondary full">Toggle Theme</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2>Add Daily Expenses</h2>
        <p>Record each payment and keep your student budget under control.</p>
      </div>
      <div class="topbar-image">
        <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=900&q=80" alt="Expense note and calculator" />
      </div>
    </header>

    <section class="grid-two reveal">
      <article class="card glass">
        <h3>New Expense</h3>
        <form id="expenseForm" class="form">
          <label>
            Title
            <input type="text" name="title" placeholder="Lunch, Bus card, Lab fee" required />
          </label>

          <label>
            Amount (PKR)
            <input type="number" name="amount" min="0.01" step="0.01" required />
          </label>

          <label>
            Category
            <select name="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fees">Fees</option>
              <option value="Books">Books</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Date
            <input type="date" name="date" required />
          </label>

          <button class="btn" type="submit">Save Expense</button>
        </form>
      </article>

      <article class="card glass">
        <div class="card-head">
          <h3>Expense History</h3>
          <button id="clearExpenses" class="btn danger small">Clear All</button>
        </div>
        <ul id="expenseList" class="list"></ul>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
