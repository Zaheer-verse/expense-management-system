<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Student Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <aside class="sidebar glass">
    <a class="brand" href="index.html">
      <span class="brand-mark">SE</span>
      <div>
        <h1>Smart Expense</h1>
        <p>Student Tracker</p>
      </div>
    </a>

    <nav>
      <a class="nav-link active" href="index.html">Dashboard</a>
      <a class="nav-link" href="add-expense.html">Add Expense</a>
      <a class="nav-link" href="analytics.html">Analytics</a>
      <a class="nav-link" href="goals.html">Saving Goals</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>

    <button id="themeToggle" class="btn secondary full">Toggle Theme</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2>Overview</h2>
        <p>Track your student life spending at a glance.</p>
      </div>
      <div class="topbar-image">
        <img src="https://images.unsplash.com/photo-1554224154-26032ffc0d07?auto=format&fit=crop&w=900&q=80" alt="Student planning budget" />
      </div>
    </header>

    <section class="cards-grid reveal">
      <article class="card glass metric">
        <h3>This Month Spend</h3>
        <p id="monthSpend">PKR 0.00</p>
      </article>
      <article class="card glass metric">
        <h3>Monthly Budget</h3>
        <p id="monthBudget">PKR 0.00</p>
      </article>
      <article class="card glass metric">
        <h3>Remaining</h3>
        <p id="monthRemaining">PKR 0.00</p>
      </article>
      <article class="card glass metric">
        <h3>Total Entries</h3>
        <p id="expenseCount">0</p>
      </article>
    </section>

    <section class="grid-two reveal">
      <article class="card glass">
        <div class="card-head">
          <h3>Category Breakdown</h3>
        </div>
        <canvas id="categoryChart" height="220"></canvas>
      </article>

      <article class="card glass">
        <div class="card-head">
          <h3>Recent Expenses</h3>
          <a class="btn small" href="add-expense.html">Add New</a>
        </div>
        <ul id="recentList" class="list clean"></ul>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
